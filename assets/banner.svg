<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811" />
      <stop offset="50%" stop-color="#0b1222" />
      <stop offset="100%" stop-color="#050914" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>
    <linearGradient id="emeraldGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="goldGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
    <linearGradient id="purpleGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="35%" stop-color="#e0f2fe" />
      <stop offset="70%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </radialGradient>

    <!-- Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.3; transform: scale(0.98); }
        50% { opacity: 0.75; transform: scale(1.02); }
      }
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-6px); }
      }
      @keyframes beamMove {
        0% { stroke-dashoffset: 400; }
        100% { stroke-dashoffset: 0; }
      }
      .circuit-line {
        stroke: #1e293b;
        stroke-width: 1.5;
        fill: none;
      }
      .active-beam {
        stroke-dasharray: 45, 155;
        animation: beamMove 3.5s linear infinite;
      }
      .glow-circle {
        transform-origin: 600px 210px;
        animation: pulseGlow 5s ease-in-out infinite;
      }
      .floating-badge {
        animation: floatSlow 4s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGradient)" stroke="#1e293b" stroke-width="2" />

  <!-- Ambient Glowing Center -->
  <circle class="glow-circle" cx="600" cy="210" r="320" fill="url(#coreGlow)" />

  <!-- Tech Grid Lines -->
  <g opacity="0.12" stroke="#38bdf8" stroke-width="0.5">
    <line x1="0" y1="70" x2="1200" y2="70" />
    <line x1="0" y1="140" x2="1200" y2="140" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="280" x2="1200" y2="280" />
    <line x1="0" y1="350" x2="1200" y2="350" />
    <line x1="150" y1="0" x2="150" y2="420" />
    <line x1="300" y1="0" x2="300" y2="420" />
    <line x1="450" y1="0" x2="450" y2="420" />
    <line x1="600" y1="0" x2="600" y2="420" />
    <line x1="750" y1="0" x2="750" y2="420" />
    <line x1="900" y1="0" x2="900" y2="420" />
    <line x1="1050" y1="0" x2="1050" y2="420" />
  </g>

  <!-- Data Highway / Circuit System -->
  <g>
    <!-- Left Circuit Path -->
    <path d="M 40 210 L 180 210 L 260 120 L 400 120" class="circuit-line" />
    <path d="M 40 210 L 180 210 L 260 120 L 400 120" class="active-beam" stroke="url(#cyanGlow)" stroke-width="2.5" fill="none" filter="url(#glow)" />

    <path d="M 80 340 L 220 340 L 320 280 L 440 280" class="circuit-line" />
    <path d="M 80 340 L 220 340 L 320 280 L 440 280" class="active-beam" stroke="url(#emeraldGlow)" stroke-width="2" fill="none" filter="url(#glow)" style="animation-duration: 4.8s;" />

    <!-- Right Circuit Path -->
    <path d="M 1160 210 L 1020 210 L 940 120 L 800 120" class="circuit-line" />
    <path d="M 1160 210 L 1020 210 L 940 120 L 800 120" class="active-beam" stroke="url(#cyanGlow)" stroke-width="2.5" fill="none" filter="url(#glow)" style="animation-duration: 3.2s;" />

    <path d="M 1120 340 L 980 340 L 880 280 L 760 280" class="circuit-line" />
    <path d="M 1120 340 L 980 340 L 880 280 L 760 280" class="active-beam" stroke="url(#goldGlow)" stroke-width="2" fill="none" filter="url(#glow)" style="animation-duration: 4.2s;" />

    <!-- Network Nodes -->
    <circle cx="180" cy="210" r="4" fill="#00f2fe" filter="url(#glow)" />
    <circle cx="260" cy="120" r="5" fill="#38bdf8" filter="url(#glow)" />
    <circle cx="220" cy="340" r="4" fill="#10b981" filter="url(#glow)" />
    <circle cx="320" cy="280" r="5" fill="#34d399" filter="url(#glow)" />
    
    <circle cx="1020" cy="210" r="4" fill="#00f2fe" filter="url(#glow)" />
    <circle cx="940" cy="120" r="5" fill="#38bdf8" filter="url(#glow)" />
    <circle cx="980" cy="340" r="4" fill="#fbbf24" filter="url(#glow)" />
    <circle cx="880" cy="280" r="5" fill="#f59e0b" filter="url(#glow)" />
  </g>

  <!-- Central Header Content -->
  <g text-anchor="middle">
    <!-- Tagline Badge -->
    <g class="floating-badge" transform="translate(0, 0)">
      <rect x="435" y="52" width="330" height="32" rx="16" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2" opacity="0.95" />
      <circle cx="454" cy="68" r="4" fill="#10b981" filter="url(#glow)" />
      <text x="605" y="73" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#38bdf8" letter-spacing="2">OPEN-SOURCE &amp; ENTERPRISE BaaS</text>
    </g>

    <!-- Main Title -->
    <text x="600" y="152" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="42" font-weight="900" fill="url(#textGradient)" letter-spacing="-1" filter="drop-shadow(0 4px 16px rgba(56, 189, 248, 0.3))">
      Awesome API Banking Platform
    </text>

    <!-- Subtitle -->
    <text x="600" y="196" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#94a3b8" letter-spacing="0.5">
      Curated Banking-as-a-Service (BaaS) • Core Banking • Financial Ledgers • Payment Rails
    </text>

    <!-- Architectural Pillar Cards -->
    <g transform="translate(180, 235)">
      <!-- Card 1: Core Banking -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="190" height="78" rx="10" fill="#0b1329" stroke="#1e293b" stroke-width="1.5" />
        <rect x="0" y="0" width="190" height="3" rx="1.5" fill="#38bdf8" />
        <text x="95" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#f8fafc">🏦 Core Banking</text>
        <text x="95" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#64748b">Fineract • Mifos • Accounts</text>
      </g>

      <!-- Card 2: Financial Ledgers -->
      <g transform="translate(215, 0)">
        <rect x="0" y="0" width="190" height="78" rx="10" fill="#0b1329" stroke="#1e293b" stroke-width="1.5" />
        <rect x="0" y="0" width="190" height="3" rx="1.5" fill="#10b981" />
        <text x="95" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#f8fafc">💰 Financial Ledgers</text>
        <text x="95" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#64748b">Formance • Midaz • Ledgers</text>
      </g>

      <!-- Card 3: Payments & Rails -->
      <g transform="translate(430, 0)">
        <rect x="0" y="0" width="190" height="78" rx="10" fill="#0b1329" stroke="#1e293b" stroke-width="1.5" />
        <rect x="0" y="0" width="190" height="3" rx="1.5" fill="#f59e0b" />
        <text x="95" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#f8fafc">💳 Payment Rails</text>
        <text x="95" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#64748b">Hyperswitch • Moov • FedNow</text>
      </g>

      <!-- Card 4: Open Banking -->
      <g transform="translate(645, 0)">
        <rect x="0" y="0" width="195" height="78" rx="10" fill="#0b1329" stroke="#1e293b" stroke-width="1.5" />
        <rect x="0" y="0" width="195" height="3" rx="1.5" fill="#a855f7" />
        <text x="97" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#f8fafc">🌐 Open Banking</text>
        <text x="97" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#64748b">OBP • ISO 20022 • PSD2</text>
      </g>
    </g>

    <!-- Bottom Feature Badges -->
    <g transform="translate(600, 368)">
      <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#475569" letter-spacing="1.5">
        ACH • RTP • FEDNOW • CARDS • ISSUING • KYC/KYB • COMPLIANCE • RECONCILIATION
      </text>
    </g>
  </g>
</svg>